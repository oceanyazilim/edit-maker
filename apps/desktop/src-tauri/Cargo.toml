[package]
name = "ai-auto-edit-studio"
description = "AI Auto Edit Studio desktop application (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "studio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
studio-core = { workspace = true }
studio-audio = { workspace = true }
studio-vision = { workspace = true }
studio-media = { workspace = true }
studio-timeline = { workspace = true }
studio-planner = { workspace = true }
studio-render = { workspace = true }
studio-project = { workspace = true }
studio-jobs = { workspace = true }
