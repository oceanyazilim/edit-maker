[workspace]
resolver = "2"
members = [
    "crates/studio-core",
    "crates/studio-audio",
    "crates/studio-vision",
    "crates/studio-media",
    "crates/studio-timeline",
    "crates/studio-planner",
    "crates/studio-render",
    "crates/studio-project",
    "crates/studio-jobs",
    "crates/studio-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
studio-audio = { path = "crates/studio-audio" }
studio-vision = { path = "crates/studio-vision" }
studio-media = { path = "crates/studio-media" }
studio-timeline = { path = "crates/studio-timeline" }
studio-planner = { path = "crates/studio-planner" }
studio-render = { path = "crates/studio-render" }
studio-project = { path = "crates/studio-project" }
studio-jobs = { path = "crates/studio-jobs" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.5", features = ["all"] }
realfft = "3"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hound = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
